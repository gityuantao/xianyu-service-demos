<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>示例 · 单页落地页 | 一口价演示</title>
<meta name="description" content="闲鱼服务演示：单页落地页模板，手机自适应"/>
<style>
:root{--bg:#0f172a;--card:#1e293b;--accent:#38bdf8;--text:#f8fafc;--muted:#94a3b8}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--text);line-height:1.55}
.wrap{max-width:720px;margin:0 auto;padding:24px 20px 64px}
.badge{display:inline-block;font-size:12px;padding:4px 10px;border-radius:999px;background:#0ea5e933;color:var(--accent);margin-bottom:12px}
h1{font-size:clamp(1.6rem,5vw,2.2rem);margin:0 0 12px}
.lead{color:var(--muted);margin:0 0 28px}
.cta{display:inline-block;background:var(--accent);color:#0f172a;font-weight:700;padding:12px 22px;border-radius:10px;text-decoration:none}
.grid{display:grid;gap:14px;margin:32px 0}
.card{background:var(--card);padding:16px 18px;border-radius:12px}
.card h3{margin:0 0 6px;font-size:1rem}.card p{margin:0;color:var(--muted);font-size:.92rem}
.foot{margin-top:40px;padding-top:20px;border-top:1px solid #334155;color:var(--muted);font-size:.85rem}
</style>
</head>
<body>
<div class="wrap">
<span class="badge">演示站 · 非真实商家</span>
<h1>三天交付的单页落地页</h1>
<p class="lead">适合活动报名、招生引流、预约引导。手机优先，边界写死，一口价不扯皮。</p>
<a class="cta" href="#contact">预约咨询（演示）</a>
<div class="grid">
<div class="card"><h3>含什么</h3><p>首屏卖点 + 说明区 + 联系/表单占位；手机自适应；部署协助。</p></div>
<div class="card"><h3>不含什么</h3><p>多页、支付、会员、小程序、投流保排名。</p></div>
<div class="card"><h3>怎么交付</h3><p>定金 50% → 预览确认 → 尾款 50%。素材齐约 3 个工作日。</p></div>
</div>
<section id="contact" class="card">
<h3>联系占位</h3>
<p>这里放微信/电话/表单。正式单会按你的素材替换。</p>
</section>
<p class="foot">本页为闲鱼服务样品演示，仅展示交付形态。</p>
</div>
</body>
</html>
